# Upstream definitions for backend services

# Backend API (FastAPI)
upstream backend_api {
    least_conn;
    server backend:8000;
    keepalive 32;
}

# Frontend (Next.js)
upstream frontend_app {
    least_conn;
    server frontend:3000;
    keepalive 32;
}

# Health check endpoint for the whole stack
upstream health_stack {
    server backend:8000;
}
