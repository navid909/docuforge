# HTTP server - redirects all traffic to HTTPS
# Also serves ACME challenge for Let's Encrypt

server {
    listen 80;
    listen [::]:80;
    server_name .${DOMAIN};

    # ACME challenge for Let's Encrypt / Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Health check endpoint (available on HTTP for load balancer probes)
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
