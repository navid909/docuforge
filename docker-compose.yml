version: '3.8'

services:
  # ================================================
  # Frontend (Next.js)
  # ================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuforge-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      - backend
    networks:
      - docuforge
    labels:
      - "traefik.enable=false"

  # ================================================
  # Backend (FastAPI)
  # ================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuforge-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - API_KEY_SECRET=${API_KEY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - CORS_ORIGINS=${CORS_ORIGINS}
      - FILE_UPLOAD_DIR=/app/tmp
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED}
    volumes:
      - backend-tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docuforge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ================================================
  # Worker (BullMQ)
  # ================================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: docuforge-worker
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - QUEUE_NAME=pdf-tasks
      - CONCURRENCY=5
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docuforge
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ================================================
  # PostgreSQL Database
  # ================================================
  postgres:
    image: postgres:16-alpine
    container_name: docuforge-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - docuforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # ================================================
  # Redis (BullMQ backend)
  # ================================================
  redis:
    image: redis:7-alpine
    container_name: docuforge-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1 --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - docuforge
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ================================================
  # Nginx Reverse Proxy
  # ================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: docuforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - docuforge
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ================================================
  # Certbot (SSL Certificates)
  # ================================================
  certbot:
    image: certbot/certbot:latest
    container_name: docuforge-certbot
    restart: unless-stopped
    volumes:
      - nginx-ssl:/etc/letsencrypt
      - nginx-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - docuforge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  backend-tmp:
    driver: local
  nginx-ssl:
    driver: local
  nginx-logs:
    driver: local
  nginx-webroot:
    driver: local

networks:
  docuforge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
